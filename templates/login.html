{% extends "base.html" %}
{% block title %}লগইন — {{ settings.site_name }}{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-icon">
      <svg class="icon"><use href="#i-user"/></svg>
    </div>
    <h1>লগইন</h1>
    <p class="muted">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>

    <form method="post" class="auth-form">
      <label>ইউজারনেম বা ইমেইল
        <input type="text" name="identifier" required autofocus>
      </label>
      <label>পাসওয়ার্ড
        <input type="password" name="password" required>
      </label>
      <button class="btn btn-primary" style="width:100%">
        <svg class="icon"><use href="#i-arrow-right"/></svg> লগইন করুন
      </button>
    </form>

    <p class="auth-footer">
      অ্যাকাউন্ট নেই? <a href="{{ url_for('signup') }}">সাইন-আপ করুন</a>
    </p>
  </div>
</div>

{% endblock %}
